[project]
name = "agent-mandaatbewijs"
version = "0.1.0"
description = "Een agentmandaat als verifieerbare credential (SD-JWT VC) over organisatiegrenzen heen: uitgever, houder (LangGraph-agent) en verifier (MCP)"
readme = "README.md"
license = "EUPL-1.2"
authors = [{ name = "Michael Owen Meijer", email = "michael@oomny.nl" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp==2.3.0",
    "httpx2==2.16.0",
    "langgraph==1.2.18",
    "langchain-core==1.7.1",
    "joserfc==1.7.7",
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
    "rich==15.0.0",
]

[project.optional-dependencies]
llm = ["langchain-openai==1.7.3"]

[project.scripts]
mandaatbewijs-uitgever = "mandaatbewijs.uitgever.app:main"
mandaatbewijs-verifier = "mandaatbewijs.verifier.app:main"
mandaatbewijs-demo = "mandaatbewijs.demo:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "ty==0.0.94",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mandaatbewijs"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C90", "PL", "N", "ASYNC", "PT"]
# N818: uitzonderingen heten hier ...Fout (Nederlands voor Error).
ignore = ["PLR2004", "RUF001", "RUF002", "RUF003", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integratie: draait tegen de echte compose-keten (uitgever, inkomensregister)"]
addopts = "-ra"
